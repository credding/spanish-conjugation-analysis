[project]
name = "spanish-conjugation-analysis"
version = "0.1.0"
description = "Analyze Spanish verb forms"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "curl-cffi>=0.15.0",
    "joblib>=1.5.3",
    "joblib-stubs>=1.5.3.1.20260117",
    "pydantic>=2.13.3",
    "requests>=2.33.1",
    "ruff>=0.15.12",
    "ty>=0.0.33",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true
