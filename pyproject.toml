[project]
name = "spanish-conjugation-analysis"
version = "0.1.0"
description = "Analyze Spanish verb forms"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "curl-cffi>=0.15.0",
    "joblib>=1.5.3",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "joblib-stubs>=1.5.3.1.20260117",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[project.scripts]
spanish-conjugation-analysis = "spanish_conjugation_analysis:main"

[build-system]
requires = ["uv_build>=0.11.12,<0.12"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "COM812",
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true
