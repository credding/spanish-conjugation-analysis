[project]
name = "spanish-conjugation-analysis"
version = "0.0.1"
description = "Analyze Spanish verb forms"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3,<4.15",
    "curl-cffi>=0.16.3",
    "ordered-enum>=0.0.10,<0.1",
    "pydantic>=2.13.5",
    "annotated-string==0.0.1",
    "tagged-index==0.0.1",
    "spanish-conjugation==0.0.1",
    "spanish-phonology==0.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "ty>=0.0.78",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
annotated-string = { workspace = true }
spanish-conjugation = { workspace = true }
spanish-grammar = { workspace = true }
spanish-phonology = { workspace = true }
tagged-index = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.ty.environment]
python = ".venv"

[tool.pytest]
addopts = [
    "--import-mode=importlib",
    "--cov",
    "--cov-report=html",
]
strict = true

[tool.coverage.run]
branch = true

[tool.ruff.lint]
select = ["ALL"]
extend-ignore = [
    "COM812",
    "D",
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.extend-per-file-ignores]
"**/*_tests/**/*.py" = [
    "PLR0913",
    "PLR0917",
    "PLR2004",
    "S101",
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.flake8-copyright]
notice-rgx = "SPDX-License-Identifier: GPL-3.0-or-later"
